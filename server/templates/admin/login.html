<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-card__icon">🏗️</div>
        <h1>CTW Admin Panel</h1>
        <p class="login-card__sub">Construction Transparency Watch</p>

        {% if error %}
        <div class="admin-alert admin-alert--error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="post" action="/admin/login" class="admin-form">
            <input type="hidden" name="next" value="{{ next }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
            <button type="submit" class="admin-btn admin-btn--primary admin-btn--full">Masuk</button>
        </form>

        <p class="login-hint">Default: <code>admin</code> / <code>admin123</code></p>
    </div>
</body>
</html>
